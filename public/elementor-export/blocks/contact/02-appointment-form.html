<section class="arefin arefin-section-divider contact-form-band arefin-mint-band seo-page-parent-block seo-parent-block seo-page-block"
         id="appointment"
         aria-labelledby="appointment-heading"
         title="Book an appointment with Dr. Murshidul Arefin — hepatobiliary consultation at Popular Medical College Hospital, Dhanmondi, Dhaka">

  <div class="arefin-container">

    <div class="contact-form-intro">
      <p class="contact-mint-kicker">Schedule a Visit</p>
      <h2 class="contact-section-heading inner-seo-header" id="appointment-heading">
        Book an <strong>Appointment</strong>
      </h2>
      <p class="contact-body-text seo-container-para paragraph-parent-block">
        Fill out the form below and our team will
        <a href="/contact/" title="Dr. Arefin team confirms your hepatobiliary appointment quickly"><strong>confirm your appointment</strong></a>
        within
        <a href="/contact/" title="Appointment confirmation within 24 hours by Dr. Arefin chamber"><strong>24 hours</strong></a>.
        For urgent inquiries, please
        <a href="tel:+8801311487592" title="Call Dr. Arefin chamber directly on +880 1311 487 592"><strong>call us directly.</strong></a>
      </p>
    </div>

    <form class="contact-form"
          method="post"
          action="/contact/#appointment"
          novalidate
          aria-label="Appointment request form for Dr. Murshidul Arefin">

      <fieldset class="contact-form-fieldset">
        <legend class="sr-only">Personal Details</legend>

        <div class="contact-form-grid">

          <div class="contact-field">
            <label for="contact-name" class="contact-label">Full Name</label>
            <input
              id="contact-name"
              name="contact-name"
              type="text"
              required
              maxlength="100"
              placeholder="Your Full Name"
              class="contact-input"
              autocomplete="name" />
          </div>

          <div class="contact-field">
            <label for="contact-email" class="contact-label">Email Address</label>
            <input
              id="contact-email"
              name="contact-email"
              type="email"
              required
              maxlength="255"
              placeholder="Your Email Address"
              class="contact-input"
              autocomplete="email" />
          </div>

          <div class="contact-field">
            <label for="contact-phone" class="contact-label">Phone Number</label>
            <input
              id="contact-phone"
              name="contact-phone"
              type="tel"
              required
              maxlength="20"
              placeholder="Country Code + Phone"
              class="contact-input"
              autocomplete="tel" />
          </div>

          <div class="contact-field">
            <label for="contact-concern" class="contact-label">Medical Concern</label>
            <div class="contact-select-wrap">
              <select
                id="contact-concern"
                name="contact-concern"
                required
                class="contact-input contact-select">
                <option value="">Select Your Medical Concern</option>
                <option value="Liver Disease Consultation">Liver Disease Consultation</option>
                <option value="Gallbladder Stone Treatment">Gallbladder Stone Treatment</option>
                <option value="Bile Duct Stone Treatment">Bile Duct Stone Treatment</option>
                <option value="Pancreatic Disease Consultation">Pancreatic Disease Consultation</option>
                <option value="Hepatobiliary Surgery Consultation">Hepatobiliary Surgery Consultation</option>
                <option value="Laparoscopic Surgery Consultation">Laparoscopic Surgery Consultation</option>
                <option value="Follow-up Appointment">Follow-up Appointment</option>
                <option value="General Surgical Consultation">General Surgical Consultation</option>
                <option value="Other">Other</option>
              </select>

              <svg class="contact-select-chev" width="16" height="16" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

        </div>

        <div class="contact-field contact-field--full">
          <label for="contact-message" class="contact-label">Message</label>
          <textarea
            id="contact-message"
            name="contact-message"
            rows="5"
            maxlength="1000"
            placeholder="Describe your condition or questions..."
            class="contact-input contact-textarea"></textarea>
        </div>

      </fieldset>

      <div class="contact-form-submit">
        <button type="submit" class="hero-cta-primary contact-submit-btn"
                title="Submit your appointment request to Dr. Arefin's chamber">
          Submit Appointment Request

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

    </form>
  </div>
</section>
