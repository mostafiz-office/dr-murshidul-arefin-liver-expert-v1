<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Liver Surgeon in Dhaka | Dr. Murshidul Arefin</title>
    <!-- No static description/og/twitter title tags here: every page supplies
         its own unique values via react-helmet. Static copies would duplicate
         the per-page tags in the served HTML (removed 2026-10-22, SEO P0). -->
    <meta name="author" content="Dr. Murshidul Arefin" />
    <meta name="keywords" content="dr murshidul arefin, liver surgeon dhaka, liver surgery dhaka, hepatobiliary surgeon bangladesh, liver transplant dhaka, liver tumor surgery, liver cyst treatment, fatty liver treatment, laparoscopic liver surgery dhaka">
    <!-- No static canonical / og:url either: react-helmet emits the correct
         per-page values on every route; statics here duplicated them with
         the homepage URL (removed 2026-10-22, SEO P0). -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://drarefin.com/wp-content/uploads/2026/04/logos.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://drarefin.com/wp-content/uploads/2026/04/logos.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Hind: used on Dr. Arefin pages -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Site icon: the file already uploaded in WordPress (Settings → Site Icon,
         attachment 1288). Exact pages bypass wp_head, so the links must live here.
         Do NOT point at /favicon.ico — no file exists at the site root (404). -->
    <link rel="icon" type="image/png" sizes="512x512" href="https://drarefin.com/wp-content/uploads/2025/10/cropped-dr-arefin-website-site-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://drarefin.com/wp-content/uploads/2025/10/cropped-dr-arefin-website-site-icon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://drarefin.com/wp-content/uploads/2025/10/cropped-dr-arefin-website-site-icon-180x180.png">
  </head>

  <body>
    <div id="root"></div>

  </body>
</html>
